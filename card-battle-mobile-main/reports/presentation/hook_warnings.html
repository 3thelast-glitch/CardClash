<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Kufi Arabic', sans-serif; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #07111f;
            color: #f8fafc;
            display: grid;
            grid-template-rows: 1fr 200px;
            border: 1px solid rgba(248, 250, 252, 0.2);
            overflow: hidden;
        }
        .quadrants-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            border-bottom: 1px solid rgba(248, 250, 252, 0.2);
        }
        .quadrant {
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 1px solid rgba(248, 250, 252, 0.2);
            border-bottom: 1px solid rgba(248, 250, 252, 0.2);
        }
        /* Remove left border for the second column in RTL */
        .quadrant:nth-child(2n) {
            border-left: none;
        }
        /* Remove bottom border for the second row */
        .quadrant:nth-child(n+3) {
            border-bottom: none;
        }
        .q-number {
            font-weight: 700;
            font-size: 48px;
            color: #38bdf8;
            margin-bottom: 16px;
            line-height: 1;
        }
        .q-text {
            font-weight: 300;
            font-size: 28px;
            line-height: 1.5;
            color: rgba(248, 250, 252, 0.9);
        }
        .q-text strong {
            font-weight: 700;
            color: #f8fafc;
        }
        .title-zone {
            padding: 40px 60px;
            display: flex;
            align-items: flex-end;
            position: relative;
        }
        .title-zone::before {
            content: '';
            position: absolute;
            top: 40px;
            right: 60px;
            width: 40px;
            height: 4px;
            background-color: #38bdf8;
        }
        .slide-title {
            font-weight: 700;
            font-size: 48px;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="quadrants-zone">
            <div class="quadrant">
                <div class="q-number">01</div>
                <div class="q-text">ليست كل قيمة مقترحة اعتماداً آمناً في رسوم <strong>Reanimated</strong>.</div>
            </div>
            <div class="quadrant">
                <div class="q-number">02</div>
                <div class="q-text">اسأل: هل يجب أن يعاد تشغيل الأثر فعلاً عندما تتغير هذه القيمة؟</div>
            </div>
            <div class="quadrant">
                <div class="q-number">03</div>
                <div class="q-text">ثبّت الدوال المتغيرة أو انقل القيم غير المحفزة إلى <strong>useRef</strong>.</div>
            </div>
            <div class="quadrant">
                <div class="q-number">04</div>
                <div class="q-text">اختبر شاشات المعركة والرسوم بصرياً بعد كل مجموعة صغيرة.</div>
            </div>
        </div>
        <div class="title-zone">
            <h2 class="slide-title">لا تعالج تحذيرات Hooks آلياً بلا اختبار</h2>
        </div>
    </div>
</body>
</html>

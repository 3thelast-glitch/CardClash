<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Kufi Arabic', sans-serif; }
        .slide-container {
            width: 1280px;
            min-height: 720px; /* must keep */
            background-color: #07111f;
            color: #f8fafc;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: 1fr 140px; /* reduced title row */
            border: 1px solid rgba(248, 250, 252, 0.2);
            overflow: hidden;
        }
        .table-zone {
            grid-column: 2 / 12;
            padding: 10px 0; /* shrink inner padding */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 24px; /* keep font size */
        }
        th {
            font-weight: 700;
            color: #38bdf8;
            padding: 8px 20px; /* reduced */
            border-bottom: 2px solid rgba(248, 250, 252, 0.2);
            text-align: right;
        }
        td {
            font-weight: 300;
            padding: 10px 20px; /* reduced */
            border-bottom: 1px solid rgba(248, 250, 252, 0.1);
            color: rgba(248, 250, 252, 0.9);
        }
        tbody tr {
            border-right: 3px solid #38bdf8;
        }
        tbody tr:nth-child(even) {
            background-color: rgba(248, 250, 252, 0.04);
        }
        .file-name {
            font-weight: 700;
            color: #f8fafc;
            direction: ltr;
            text-align: left;
            display: inline-block;
        }
        .warning-count {
            font-weight: 700;
            color: #38bdf8;
            font-size: 28px;
        }
        .title-zone {
            grid-column: 1 / 13;
            padding: 40px 40px 10px 40px; /* keep top padding, reduce bottom & sides */
            border-top: 1px solid rgba(248, 250, 252, 0.2);
            display: flex;
            align-items: flex-end;
            position: relative;
        }
        .title-zone::before {
            content: '';
            position: absolute;
            top: 40px; /* keep top offset */
            right: 40px; /* adjusted to match side padding */
            width: 40px;
            height: 4px;
            background-color: #38bdf8;
        }
        .slide-title {
            font-weight: 700;
            font-size: 48px;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="table-zone">
            <table>
                <thead>
                    <tr>
                        <th style="width: 35%;">الملف</th>
                        <th style="width: 15%;">التحذيرات</th>
                        <th style="width: 50%;">التفاصيل</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><span class="file-name">battle.tsx</span></td>
                        <td class="warning-count">18</td>
                        <td>شاشة المعركة الأساسية.</td>
                    </tr>
                    <tr>
                        <td><span class="file-name">_layout.tsx</span></td>
                        <td class="warning-count">17</td>
                        <td>جميعها ترتيب استيراد منخفض المخاطر.</td>
                    </tr>
                    <tr>
                        <td><span class="file-name">sandbox.tsx</span></td>
                        <td class="warning-count">10</td>
                        <td>6 تحذيرات مرتبطة بـ Hooks.</td>
                    </tr>
                    <tr>
                        <td><span class="file-name">luxury-character-card-animated.tsx</span></td>
                        <td class="warning-count">10</td>
                        <td>6 تحذيرات مرتبطة بالرسوم المتحركة.</td>
                    </tr>
                    <tr>
                        <td><span class="file-name">RarityCard.tsx</span></td>
                        <td class="warning-count">8</td>
                        <td>مرشح جيد لتنظيف منضبط.</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="title-zone">
            <h2 class="slide-title">خمس مناطق تستحق المعالجة أولاً</h2>
        </div>
    </div>
</body>
</html>

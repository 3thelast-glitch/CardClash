<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Kufi Arabic', sans-serif; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #07111f;
            color: #f8fafc;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: 1fr 200px;
            border: 1px solid rgba(248, 250, 252, 0.2);
            overflow: hidden;
        }
        .steps-zone {
            grid-column: 1 / 13;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-bottom: 1px solid rgba(248, 250, 252, 0.2);
        }
        .step-block {
            padding: 50px 40px;
            border-left: 1px solid rgba(248, 250, 252, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .step-block:last-child {
            border-left: none;
        }
        .step-number {
            font-weight: 700;
            font-size: 72px;
            color: rgba(56, 189, 248, 0.2);
            line-height: 1;
            margin-bottom: 10px;
        }
        .step-title {
            font-weight: 700;
            font-size: 32px;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .step-desc {
            font-weight: 300;
            font-size: 22px;
            line-height: 1.6;
            color: rgba(248, 250, 252, 0.9);
        }
        code {
            font-family: monospace;
            background: rgba(248, 250, 252, 0.1);
            padding: 2px 6px;
            font-size: 20px;
        }
        .title-zone {
            grid-column: 1 / 13;
            padding: 40px 60px;
            display: flex;
            align-items: flex-end;
            position: relative;
        }
        .title-zone::before {
            content: '';
            position: absolute;
            top: 40px;
            right: 60px;
            width: 40px;
            height: 4px;
            background-color: #38bdf8;
        }
        .slide-title {
            font-weight: 700;
            font-size: 56px;
            line-height: 1.1;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="steps-zone">
            <div class="step-block">
                <div class="step-number">01</div>
                <div class="step-title">آمنة</div>
                <div class="step-desc">ترتيب ودمج الاستيرادات وأنماط النوع؛ مراجعة فرق التغيير.</div>
            </div>
            <div class="step-block">
                <div class="step-number">02</div>
                <div class="step-title">تنظيف</div>
                <div class="step-desc">حذف الاستيرادات والمتغيرات غير المستخدمة بعد فحص الأثر الجانبي.</div>
            </div>
            <div class="step-block">
                <div class="step-number">03</div>
                <div class="step-title">Hooks</div>
                <div class="step-desc">مراجعة كل أثر، مع <code>useCallback</code> أو <code>useRef</code> عند اللزوم.</div>
            </div>
            <div class="step-block">
                <div class="step-number">04</div>
                <div class="step-title">وقائية</div>
                <div class="step-desc">إضافة فحص lint في CI ومنع زيادة التحذيرات الجديدة.</div>
            </div>
        </div>
        <div class="title-zone">
            <h2 class="slide-title">معالجة التحذيرات على أربع دفعات</h2>
        </div>
    </div>
</body>
</html>

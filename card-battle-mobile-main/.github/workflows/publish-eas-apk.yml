name: Publish EAS APK release

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Direct Expo EAS APK URL
        required: true
        type: string
      tag:
        description: GitHub release tag
        required: true
        default: v1.0.1
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from Expo
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: |
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output card-clash-${{ inputs.tag }}.apk "$ARTIFACT_URL"
          file card-clash-${{ inputs.tag }}.apk
          sha256sum card-clash-${{ inputs.tag }}.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" "card-clash-${{ inputs.tag }}.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Card Clash Android ${{ inputs.tag }}" \
            --notes $'## تصميم الكروت الأسطورية الجديد\n\n- استبدال قالب الكرت الأسطوري القديم بالكامل بمسار Full Art Tactical مستقل.\n- عرض فن كامل مع إطار ذهبي هادئ، وشارة العنصر في أعلى اليسار، وشارة «أسطوري» في أعلى اليمين.\n- تبسيط الشريط السفلي ليعرض الهجوم والدفاع فقط، من دون الصحة أو النجوم أو لوحة القدرة القديمة.\n- تطبيق التصميم نفسه في المعرض واختيار الكروت والمعركة والمعركة الجماعية، مع الحفاظ على الصور والفيديو والصوت.\n\n### التثبيت\nنزّل ملف APK، ثم افتحه من مجلد التنزيلات على Android واسمح بالتثبيت من المصدر المستخدم عند الطلب.' \
            --latest

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Kufi Arabic', sans-serif; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #07111f;
            color: #f8fafc;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: 1fr;
            border: 1px solid rgba(248, 250, 252, 0.2);
            overflow: hidden;
            position: relative;
        }
        .visual-zone {
            grid-column: 8 / 13; /* Left side in RTL */
            border-left: 1px solid rgba(248, 250, 252, 0.2);
            position: relative;
            overflow: hidden;
        }
        .visual-zone img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            filter: grayscale(30%) contrast(1.2);
        }
        .content-zone {
            grid-column: 1 / 8; /* Right side in RTL */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 60px;
            position: relative;
        }
        .content-zone::after {
            content: '';
            position: absolute;
            top: 60px;
            right: 60px;
            width: 60px;
            height: 4px;
            background-color: #38bdf8;
        }
        .subtitle {
            font-weight: 300;
            font-size: 28px;
            line-height: 1.6;
            color: rgba(248, 250, 252, 0.8);
            margin-bottom: 20px;
            max-width: 90%;
        }
        .title {
            font-weight: 700;
            font-size: 84px;
            line-height: 1.1;
            color: #f8fafc;
            letter-spacing: -1px;
        }
        .accent-text {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content-zone">
            <div class="subtitle">تدقيق القدرات الـ54 وخطة رفع جودة الكود:<br>نتائج الاختبارات، الإصلاحات، وتحذيرات ESLint</div>
            <h1 class="title">Card <span class="accent-text">Clash</span></h1>
        </div>
        <div class="visual-zone">
            <img src="/home/ubuntu/upload/search_images/LwM0Z9mD7GeY.jpg" alt="Dark Fantasy Card Back">
        </div>
    </div>
</body>
</html>

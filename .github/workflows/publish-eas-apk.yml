name: Build and publish Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.7
        required: true
        type: string
      artifact_url:
        description: Optional direct Expo EAS APK URL. Leave empty to build a new APK.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build Player APK and publish Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CardClash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: CardClash/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected a tag such as v1.0.7"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=CardClash-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Validate app version for tagged releases
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG_VERSION="${{ steps.release.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"

          CONFIG_VERSION="$(node -e "const c=require('./app.config.js'); process.stdout.write(c.version)")"

          echo "Tag version:    $TAG_VERSION"
          echo "App version:    $CONFIG_VERSION"

          if [ "$TAG_VERSION" != "$CONFIG_VERSION" ]; then
            echo "Tag version does not match app.config.js version."
            exit 1
          fi

      - name: Use supplied APK URL
        if: github.event_name == 'workflow_dispatch' && inputs.artifact_url != ''
        id: supplied-apk
        shell: bash
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: |
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Build Player APK with EAS
        if: github.event_name == 'push' || inputs.artifact_url == ''
        id: eas-build
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub Actions secret: EXPO_TOKEN"
            echo "Create an Expo access token and save it as the repository secret EXPO_TOKEN."
            exit 1
          fi

          npx eas-cli@latest build \
            --platform android \
            --profile player \
            --non-interactive \
            --wait \
            --json > eas-build.json

          cat eas-build.json

          ARTIFACT_URL="$(node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const build = Array.isArray(raw) ? raw[0] : raw;
          const url = build?.artifacts?.applicationArchiveUrl;
          if (!url) process.exit(1);
          process.stdout.write(url);
          NODE
          )"

          if [ -z "$ARTIFACT_URL" ]; then
            echo "EAS build completed but no applicationArchiveUrl was returned."
            exit 1
          fi

          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Download and validate APK
        shell: bash
        env:
          BUILT_URL: ${{ steps.eas-build.outputs.artifact_url }}
          SUPPLIED_URL: ${{ steps.supplied-apk.outputs.artifact_url }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
        run: |
          ARTIFACT_URL="${BUILT_URL:-$SUPPLIED_URL}"

          if [ -z "$ARTIFACT_URL" ]; then
            echo "No APK artifact URL is available."
            exit 1
          fi

          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "$APK_NAME" "$ARTIFACT_URL"

          test -s "$APK_NAME"

          MIME_TYPE="$(file --brief --mime-type "$APK_NAME")"
          if [ "$MIME_TYPE" != "application/vnd.android.package-archive" ] && [ "$MIME_TYPE" != "application/zip" ]; then
            echo "Expected an APK, but received MIME type: $MIME_TYPE"
            exit 1
          fi

          unzip -tq "$APK_NAME"
          unzip -l "$APK_NAME" | grep -q 'AndroidManifest.xml'

          echo "APK validated successfully:"
          file "$APK_NAME"
          sha256sum "$APK_NAME"

      - name: Publish APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$TAG" "$APK_NAME" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Card Clash Android $TAG" \
              --generate-notes \
              --latest
          fi

      - name: Release summary
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
        run: |
          {
            echo "## Android release published"
            echo
            echo "- Release: **$TAG**"
            echo "- APK: **$APK_NAME**"
            echo "- Location: GitHub → Releases"
          } >> "$GITHUB_STEP_SUMMARY"

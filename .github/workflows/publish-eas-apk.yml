name: Build and publish Android APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.7
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build Player and Developer APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'

    defaults:
      run:
        working-directory: CardClash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: CardClash/pnpm-lock.yaml

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ inputs.tag }}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected a tag such as v1.0.7"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "player_apk=CardClash-Player-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "developer_apk=CardClash-Developer-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Validate app version
        shell: bash
        env:
          TAG_VERSION: ${{ steps.release.outputs.version }}
        run: |
          CONFIG_VERSION="$(node -e "const c=require('./app.config.js'); process.stdout.write(c.version)")"

          echo "Release version: $TAG_VERSION"
          echo "App version:     $CONFIG_VERSION"

          if [ "$TAG_VERSION" != "$CONFIG_VERSION" ]; then
            echo "Release tag version does not match app.config.js version."
            exit 1
          fi

      - name: Prepare release directory
        run: mkdir -p release-assets

      - name: Build Player APK
        shell: bash
        env:
          APP_VARIANT: player
          APK_NAME: ${{ steps.release.outputs.player_apk }}
        run: |
          rm -rf android
          pnpm exec expo prebuild --platform android --clean --no-install

          cat >> android/gradle.properties <<'EOF'
          kotlin.compiler.execution.strategy=in-process
          org.gradle.daemon=false
          EOF

          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..

          APK_PATH="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Player APK was not produced."
            exit 1
          fi

          cp "$APK_PATH" "release-assets/$APK_NAME"

      - name: Build Developer APK
        shell: bash
        env:
          APP_VARIANT: developer
          APK_NAME: ${{ steps.release.outputs.developer_apk }}
        run: |
          rm -rf android
          pnpm exec expo prebuild --platform android --clean --no-install

          cat >> android/gradle.properties <<'EOF'
          kotlin.compiler.execution.strategy=in-process
          org.gradle.daemon=false
          EOF

          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..

          APK_PATH="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Developer APK was not produced."
            exit 1
          fi

          cp "$APK_PATH" "release-assets/$APK_NAME"

      - name: Validate APK files and signatures
        shell: bash
        env:
          PLAYER_APK: ${{ steps.release.outputs.player_apk }}
          DEVELOPER_APK: ${{ steps.release.outputs.developer_apk }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          for APK in "$PLAYER_APK" "$DEVELOPER_APK"; do
            FILE="release-assets/$APK"

            test -s "$FILE"
            unzip -tq "$FILE"
            unzip -l "$FILE" | grep -q 'AndroidManifest.xml'

            echo "Validating signature: $APK"
            "$APKSIGNER" verify --verbose "$FILE"

            echo "Android package metadata:"
            "$AAPT" dump badging "$FILE" | head -n 3

            echo "SHA-256:"
            sha256sum "$FILE"
          done

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardClash-${{ steps.release.outputs.tag }}-Android-APKs
          path: |
            CardClash/release-assets/${{ steps.release.outputs.player_apk }}
            CardClash/release-assets/${{ steps.release.outputs.developer_apk }}
          if-no-files-found: error

      - name: Publish APKs to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PLAYER_APK: ${{ steps.release.outputs.player_apk }}
          DEVELOPER_APK: ${{ steps.release.outputs.developer_apk }}
        run: |
          PLAYER_FILE="release-assets/$PLAYER_APK"
          DEVELOPER_FILE="release-assets/$DEVELOPER_APK"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PLAYER_FILE" "$DEVELOPER_FILE" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$TAG" "$PLAYER_FILE" "$DEVELOPER_FILE" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Card Clash Android $TAG" \
              --generate-notes \
              --latest
          fi

      - name: Release summary
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PLAYER_APK: ${{ steps.release.outputs.player_apk }}
          DEVELOPER_APK: ${{ steps.release.outputs.developer_apk }}
        run: |
          {
            echo "## Android release published"
            echo
            echo "- Release: **$TAG**"
            echo "- Player: **$PLAYER_APK**"
            echo "- Developer: **$DEVELOPER_APK**"
            echo "- Build method: local Gradle build on GitHub Actions"
            echo "- Expo token required: **No**"
          } >> "$GITHUB_STEP_SUMMARY"

name: Publish EAS APK release

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Direct Expo EAS APK URL
        required: true
        type: string
      tag:
        description: GitHub release tag
        required: true
        default: v1.0.1
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from Expo
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: |
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output card-clash-${{ inputs.tag }}.apk "$ARTIFACT_URL"
          file card-clash-${{ inputs.tag }}.apk
          sha256sum card-clash-${{ inputs.tag }}.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" "card-clash-${{ inputs.tag }}.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Card Clash Android ${{ inputs.tag }}" \
            --notes $'## إصلاحات v1.0.1\n\n- إصلاح تشغيل صوت فيديو كرت اللاعب على الجوال.\n- احترام إعداد الصوت العام عند تشغيل فيديوهات البطاقات.\n- إضافة مؤثرات صوتية محلية لأحداث الهجوم والقدرات ونتائج الجولة.\n\n### التثبيت\nنزّل ملف APK، ثم افتحه من مجلد التنزيلات على Android واسمح بالتثبيت من المصدر المستخدم عند الطلب.' \
            --latest

name: Apply mobile layout hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-layout-hotfix.yml

permissions:
  contents: write

jobs:
  patch-mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: CardClash/pnpm-lock.yaml

      - name: Patch mobile layouts
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "CardClash/app/screens/card-selection.tsx",
              """  // الهاتف العمودي يستخدم سكة أفقية حتى يظهر كل كرت كاملاً ولا يُقص الكرت الثالث.\n  const abilityPreviewHorizontal = !isLandscape && width < 520;\n  const abilityModalWidth = Math.min(width - Math.max(20, modalPadding * 2), 700);\n  const abilityPreviewCardH = abilityPreviewHorizontal\n    ? Math.max(182, Math.min(238, Math.round(height * 0.34)))\n    : Math.max(200, Math.min(300, Math.round(height * 0.52)));\n  const abilityPreviewCardW = Math.round(abilityPreviewCardH * (160 / 240));\n  const abilityPreviewGap = abilityPreviewHorizontal ? Math.max(10, modalGap) : modalGap;""",
              """  // على الهاتف العمودي نعرض القدرات الثلاث معاً داخل صف واحد بدلاً من إخفاء الثالثة خلف السحب.\n  const abilityMobileThreeAcross = !isLandscape && width < 520;\n  const abilityPreviewHorizontal = false;\n  const abilityModalWidth = Math.min(width - Math.max(12, modalPadding), 700);\n  const abilityPreviewGap = abilityMobileThreeAcross ? 6 : modalGap;\n  const abilityRailHorizontalPadding = Math.max(4, modalPadding / 2);\n  const abilityModalInnerWidth = Math.max(0, abilityModalWidth - modalPadding * 2 - abilityRailHorizontalPadding * 2);\n  const abilityPreviewCardW = abilityMobileThreeAcross\n    ? Math.max(88, Math.floor((abilityModalInnerWidth - abilityPreviewGap * 2) / 3))\n    : Math.round(Math.max(200, Math.min(300, Math.round(height * 0.52))) * (160 / 240));\n  const abilityPreviewCardH = abilityMobileThreeAcross\n    ? Math.round(abilityPreviewCardW * (330 / 220))\n    : Math.max(200, Math.min(300, Math.round(height * 0.52)));""",
          )

          replace_once(
              "CardClash/app/screens/card-selection.tsx",
              "{ gap: abilityPreviewGap, paddingHorizontal: Math.max(4, modalPadding / 2), paddingVertical: Math.max(6, modalPadding / 2) },",
              "{ gap: abilityPreviewGap, paddingHorizontal: abilityRailHorizontalPadding, paddingVertical: Math.max(6, modalPadding / 2) },",
          )

          replace_once(
              "CardClash/app/screens/battle.tsx",
              "  const portraitCommandWidth = Math.min(cardWidth, 340);",
              "  // في العمودي يجب أن تستخدم لوحة الأوامر عرض المنطقة الوسطى، لا عرض البطاقة الضيق.\n  const portraitCommandWidth = Math.min(centerWidth, 340);",
          )

          replace_once(
              "CardClash/app/screens/battle.tsx",
              "  }, [currentPlayerCard, currentBotCard, phase, state.currentRound]);",
              "  }, [currentPlayerCard?.id, currentBotCard?.id, phase, state.currentRound]);",
          )

          replace_once(
              "CardClash/app/screens/battle.tsx",
              "  centerPanelPortrait: { minHeight: 0, maxHeight: 156, flexGrow: 0, flexShrink: 1, gap: 6, alignSelf: 'center' },",
              "  // نحجز مساحة ثابتة لأزرار المعاينة/القدرة/الهجوم حتى لا يضغطها Flex إلى الصفر على Android.\n  centerPanelPortrait: { minHeight: 136, maxHeight: 190, flexGrow: 0, flexShrink: 0, gap: 6, alignSelf: 'center' },",
          )

      - name: Install dependencies
        working-directory: CardClash
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: CardClash
        run: pnpm check

      - name: Unit tests
        working-directory: CardClash
        run: pnpm test

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CardClash/app/screens/card-selection.tsx CardClash/app/screens/battle.tsx
          git diff --cached --check
          git commit -m "fix: keep mobile cards and battle controls visible"
          git push origin HEAD:main

name: Apply rage availability hotfix

on:
  push:
    paths:
      - '.github/workflows/fix-rage-availability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-battle-rage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch rage availability and button width
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CardClash/app/screens/battle.tsx')
          text = path.read_text()

          old = """  const expectedWinner = expectedRoundResult?.winner;
  const canPlayerRageNow = expectedWinner === 'bot'
    && !!currentPlayerCard
    && shouldTriggerRage(currentPlayerCard, rageStates.current.player);
  const canGuestRageNow = isLocalTwoPlayer
    && expectedWinner === 'player'
    && !!currentBotCard
    && shouldTriggerRage(currentBotCard, rageStates.current.bot);
"""
          new = """  // الغضب فعل للكرت نفسه، وليس فعلاً مشروطاً بتوقع خسارة الجولة.
  // لذلك يبقى الزر متاحاً متى كان للكرت Rage صالح، حتى لو كانت المعاينة الحالية تتوقع فوزه.
  const canPlayerRageNow = !!currentPlayerCard
    && shouldTriggerRage(currentPlayerCard, rageStates.current.player);
  const canGuestRageNow = isLocalTwoPlayer
    && !!currentBotCard
    && shouldTriggerRage(currentBotCard, rageStates.current.bot);
  // إذا كان لدى الطرفين غضب في نفس الجولة نتقاسم الصف، وإلا يأخذ الزر كامل العرض.
  const rageButtonWidth = !isLandscape && canPlayerRageNow && canGuestRageNow
    ? commandButtonWidth
    : commandFullButtonWidth;
"""
          if old not in text:
              raise SystemExit('rage eligibility marker not found')
          text = text.replace(old, new, 1)

          old_player = "style={[S.rageBtn, { width: commandFullButtonWidth, height: actionButtonHeight }]}"
          new_player = "style={[S.rageBtn, { width: rageButtonWidth, height: actionButtonHeight }]}"
          if old_player not in text:
              raise SystemExit('player rage width marker not found')
          text = text.replace(old_player, new_player, 1)

          old_guest = "style={[S.rageBtn, S.guestRageBtn, { width: commandFullButtonWidth, height: actionButtonHeight }]}"
          new_guest = "style={[S.rageBtn, S.guestRageBtn, { width: rageButtonWidth, height: actionButtonHeight }]}"
          if old_guest not in text:
              raise SystemExit('guest rage width marker not found')
          text = text.replace(old_guest, new_guest, 1)

          path.write_text(text)
          PY
      - name: Commit hotfix
        run: |
          if git diff --quiet -- CardClash/app/screens/battle.tsx; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CardClash/app/screens/battle.tsx
          git commit -m "fix: show rage whenever the current card can rage"
          git push origin HEAD:main

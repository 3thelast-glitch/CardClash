name: Apply battle HUD polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hud-polish-hotfix.yml

permissions:
  contents: write

jobs:
  polish-hud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: CardClash/pnpm-lock.yaml

      - name: Polish battle HUD
        shell: python
        run: |
          from pathlib import Path

          path = Path('CardClash/app/screens/battle.tsx')
          text = path.read_text(encoding='utf-8')

          old_markup = '''          <View style={[S.topHud, { paddingHorizontal: hudPadding }]}>
            <View style={S.hudSide}>
              {isDeveloperVariant ? (
                <TouchableOpacity
                  accessibilityRole="button"
                  accessibilityLabel="منح كرت لا شيء لا شيء حدث للمطوّر"
                  testID="developer-nothing-happened-shortcut"
                  style={[S.avatar, S.developerAvatar, { borderColor: '#e879f9' }]}
                  onPress={handleDeveloperAbilityGrant}
                  activeOpacity={0.78}
                >
                  <Text style={{ fontSize: 18 }}>👤</Text>
                </TouchableOpacity>
              ) : <View style={[S.avatar, { borderColor: '#4ade80' }]}><Text style={{ fontSize: 18 }}>👤</Text></View>}
              <View style={S.hudInfo}>
                <Text style={[S.hudName, { color: '#4ade80' }]}>{playerLabel}</Text>
                <ScoreBar score={state.playerScore} maxScore={maxScore} color="#4ade80" />
              </View>
              <Text style={[S.hudScore, { color: '#4ade80' }]}>{state.playerScore}</Text>
            </View>
            <View style={S.hudCenter}>
              <Text style={S.hudRound}>جولة {state.currentRound + 1} / {state.totalRounds}</Text>
              <RoundBar current={state.currentRound} total={state.totalRounds} />
              <View style={S.hudHistoryRow}>
                <TouchableOpacity style={S.historyBtn} onPress={() => setIsHistoryModalOpen(true)} activeOpacity={0.75}>
                  <Text style={S.historyBtnText}>سجل الجولة ↗️</Text>
                </TouchableOpacity>
                {isLocalTwoPlayer && (
                  <TouchableOpacity style={[S.historyBtn, S.abilityHistoryBtn]} onPress={() => setIsUsedAbilitiesModalOpen(true)} activeOpacity={0.75}>
                    <Text style={S.historyBtnText}>⚡ كروت القدرات</Text>
                  </TouchableOpacity>
                )}
              </View>
            </View>
            <View style={[S.hudSide, S.hudSideRight]}>
              <Text style={[S.hudScore, { color: '#f87171' }]}>{state.botScore}</Text>
              <View style={S.hudInfo}>
                <Text style={[S.hudName, { color: '#f87171', textAlign: 'right' }]}>{opponentLabel}</Text>
                <ScoreBar score={state.botScore} maxScore={maxScore} color="#f87171" reverse />
              </View>
              <View style={[S.avatar, { borderColor: '#f87171' }]}><Text style={{ fontSize: 18 }}>{isLocalTwoPlayer ? '🤝' : '🤖'}</Text></View>
            </View>
          </View>'''

          new_markup = '''          <View style={[S.topHud, { paddingHorizontal: Math.max(6, hudPadding) }]}>
            <View style={[S.hudSide, S.hudPlayerSide]}>
              <View style={S.hudIdentityRow}>
                {isDeveloperVariant ? (
                  <TouchableOpacity
                    accessibilityRole="button"
                    accessibilityLabel="منح كرت لا شيء لا شيء حدث للمطوّر"
                    testID="developer-nothing-happened-shortcut"
                    style={[S.avatar, S.developerAvatar, { borderColor: '#e879f9' }]}
                    onPress={handleDeveloperAbilityGrant}
                    activeOpacity={0.78}
                  >
                    <Text style={S.avatarEmoji}>👤</Text>
                  </TouchableOpacity>
                ) : <View style={[S.avatar, { borderColor: '#22c55e' }]}><Text style={S.avatarEmoji}>👤</Text></View>}
                <View style={S.hudScoreBlock}>
                  <Text style={[S.hudScore, { color: '#22e77a' }]}>{state.playerScore}</Text>
                  <Text numberOfLines={1} ellipsizeMode="tail" style={[S.hudName, { color: '#86efac' }]}>{playerLabel}</Text>
                </View>
              </View>
              <ScoreBar score={state.playerScore} maxScore={maxScore} color="#22e77a" />
            </View>

            <View style={S.hudCenter}>
              <View style={S.roundPill}>
                <Text style={S.hudRound}>الجولة {state.currentRound + 1} / {state.totalRounds}</Text>
              </View>
              <View style={S.roundProgressWrap}>
                <RoundBar current={state.currentRound} total={state.totalRounds} />
              </View>
              <View style={S.hudHistoryRow}>
                <TouchableOpacity style={S.historyBtn} onPress={() => setIsHistoryModalOpen(true)} activeOpacity={0.75}>
                  <Text numberOfLines={1} style={S.historyBtnText}>📜 سجل الجولة</Text>
                </TouchableOpacity>
                {isLocalTwoPlayer && (
                  <TouchableOpacity style={[S.historyBtn, S.abilityHistoryBtn]} onPress={() => setIsUsedAbilitiesModalOpen(true)} activeOpacity={0.75}>
                    <Text numberOfLines={1} style={S.historyBtnText}>⚡ القدرات</Text>
                  </TouchableOpacity>
                )}
              </View>
            </View>

            <View style={[S.hudSide, S.hudBotSide]}>
              <View style={[S.hudIdentityRow, S.hudIdentityRowReverse]}>
                <View style={[S.avatar, { borderColor: '#fb7185' }]}><Text style={S.avatarEmoji}>{isLocalTwoPlayer ? '🤝' : '🤖'}</Text></View>
                <View style={[S.hudScoreBlock, S.hudScoreBlockRight]}>
                  <Text style={[S.hudScore, { color: '#ff6678' }]}>{state.botScore}</Text>
                  <Text numberOfLines={1} ellipsizeMode="tail" style={[S.hudName, { color: '#fda4af', textAlign: 'right' }]}>{opponentLabel}</Text>
                </View>
              </View>
              <ScoreBar score={state.botScore} maxScore={maxScore} color="#ff6678" reverse />
            </View>
          </View>'''

          if text.count(old_markup) != 1:
              raise SystemExit(f'Expected one HUD markup block, found {text.count(old_markup)}')
          text = text.replace(old_markup, new_markup, 1)

          old_styles = '''  topHud: { flexDirection: 'row', alignItems: 'center', paddingHorizontal: SPACE.lg, paddingVertical: SPACE.sm, gap: SPACE.sm, backgroundColor: 'rgba(7,20,27,0.78)', borderBottomWidth: 1, borderBottomColor: 'rgba(57,230,208,0.14)' },
  hudSide: { flex: 1, flexDirection: 'row', alignItems: 'center', gap: SPACE.sm },
  hudSideRight: { flexDirection: 'row-reverse' },
  avatar: { width: 36, height: 36, borderRadius: 18, borderWidth: 2, backgroundColor: 'rgba(7,20,27,0.88)', alignItems: 'center', justifyContent: 'center' },
  developerAvatar: { borderStyle: 'dashed', backgroundColor: 'rgba(232,121,249,0.16)' },
  hudInfo: { flex: 1, gap: 3 },
  hudName: { fontSize: FONT.xs, fontWeight: '700', letterSpacing: 0.5 },
  hudScore: { fontSize: FONT.xl, fontWeight: '900', minWidth: 28, textAlign: 'center', fontVariant: ['tabular-nums'] } as any,
  hudCenter: { flex: 1.2, alignItems: 'center', gap: 3 },
  hudRound: { color: COLOR.gold, fontSize: FONT.xs, fontWeight: '700', letterSpacing: 0.4 },
  hudHistoryRow: { flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: 5 },
  historyBtn: { paddingHorizontal: SPACE.sm, paddingVertical: 2, borderRadius: RADIUS.sm, backgroundColor: 'rgba(57,230,208,0.08)', borderWidth: 1, borderColor: 'rgba(57,230,208,0.20)' },
  historyBtnText: { color: '#BFFAF2', fontSize: FONT.xs - 1 },
  abilityHistoryBtn: { backgroundColor: 'rgba(232,121,249,0.12)', borderColor: 'rgba(232,121,249,0.35)' },'''

          new_styles = '''  topHud: {
    flexDirection: 'row',
    alignItems: 'stretch',
    paddingHorizontal: SPACE.sm,
    paddingVertical: 7,
    marginHorizontal: 2,
    marginTop: 2,
    gap: 6,
    backgroundColor: 'rgba(3,15,22,0.94)',
    borderWidth: 1,
    borderColor: 'rgba(34,211,238,0.30)',
    borderRadius: 16,
    shadowColor: '#22d3ee',
    shadowOpacity: 0.18,
    shadowRadius: 10,
    shadowOffset: { width: 0, height: 3 },
    elevation: 6,
  },
  hudSide: {
    flex: 1,
    minWidth: 0,
    justifyContent: 'space-between',
    gap: 5,
    paddingHorizontal: 7,
    paddingVertical: 6,
    borderRadius: 12,
    borderWidth: 1,
  },
  hudPlayerSide: { backgroundColor: 'rgba(34,197,94,0.075)', borderColor: 'rgba(34,231,122,0.24)' },
  hudBotSide: { backgroundColor: 'rgba(251,113,133,0.075)', borderColor: 'rgba(255,102,120,0.24)' },
  hudIdentityRow: { flexDirection: 'row', alignItems: 'center', gap: 6, minWidth: 0 },
  hudIdentityRowReverse: { flexDirection: 'row-reverse' },
  avatar: {
    width: 40,
    height: 40,
    borderRadius: 20,
    borderWidth: 2,
    backgroundColor: 'rgba(2,12,18,0.96)',
    alignItems: 'center',
    justifyContent: 'center',
    shadowColor: '#ffffff',
    shadowOpacity: 0.08,
    shadowRadius: 5,
    elevation: 2,
  },
  avatarEmoji: { fontSize: 18 },
  developerAvatar: { borderStyle: 'dashed', backgroundColor: 'rgba(232,121,249,0.16)' },
  hudScoreBlock: { flex: 1, minWidth: 0, justifyContent: 'center' },
  hudScoreBlockRight: { alignItems: 'flex-end' },
  hudName: { fontSize: 10, fontWeight: '800', letterSpacing: 0.2, width: '100%' },
  hudScore: { fontSize: 25, lineHeight: 27, fontWeight: '900', textAlign: 'left', fontVariant: ['tabular-nums'] } as any,
  hudCenter: {
    flex: 1.15,
    minWidth: 0,
    alignItems: 'center',
    justifyContent: 'center',
    gap: 5,
    paddingHorizontal: 6,
    paddingVertical: 5,
    borderRadius: 12,
    backgroundColor: 'rgba(34,211,238,0.055)',
    borderWidth: 1,
    borderColor: 'rgba(34,211,238,0.16)',
  },
  roundPill: { paddingHorizontal: 9, paddingVertical: 2, borderRadius: RADIUS.full, backgroundColor: 'rgba(34,211,238,0.10)' },
  hudRound: { color: '#67e8f9', fontSize: 11, fontWeight: '900', letterSpacing: 0.25, textAlign: 'center' },
  roundProgressWrap: { width: '100%', paddingHorizontal: 2 },
  hudHistoryRow: { width: '100%', flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: 4 },
  historyBtn: {
    flex: 1,
    minWidth: 0,
    paddingHorizontal: 6,
    paddingVertical: 5,
    borderRadius: 9,
    backgroundColor: 'rgba(34,211,238,0.10)',
    borderWidth: 1,
    borderColor: 'rgba(34,211,238,0.28)',
    alignItems: 'center',
    justifyContent: 'center',
  },
  historyBtnText: { color: '#cffafe', fontSize: 9, fontWeight: '800', textAlign: 'center' },
  abilityHistoryBtn: { backgroundColor: 'rgba(232,121,249,0.10)', borderColor: 'rgba(232,121,249,0.30)' },'''

          if text.count(old_styles) != 1:
              raise SystemExit(f'Expected one HUD style block, found {text.count(old_styles)}')
          text = text.replace(old_styles, new_styles, 1)
          path.write_text(text, encoding='utf-8')

      - name: Install dependencies
        working-directory: CardClash
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: CardClash
        run: pnpm check

      - name: Unit tests
        working-directory: CardClash
        run: pnpm test

      - name: Commit HUD polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CardClash/app/screens/battle.tsx
          git diff --cached --check
          git commit -m "style: polish mobile battle HUD"
          git push origin HEAD:main

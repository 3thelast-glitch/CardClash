name: Apply battle HUD polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hud-polish-hotfix.yml
      - .github/scripts/hud_polish.py

permissions:
  contents: write

jobs:
  polish-hud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: CardClash/pnpm-lock.yaml

      - name: Apply HUD polish
        run: python .github/scripts/hud_polish.py

      - name: Install dependencies
        working-directory: CardClash
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: CardClash
        run: pnpm check

      - name: Unit tests
        working-directory: CardClash
        run: pnpm test

      - name: Commit HUD polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CardClash/app/screens/battle.tsx
          git diff --cached --check
          git commit -m "style: polish mobile battle HUD"
          git push origin HEAD:main
